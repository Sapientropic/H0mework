<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img">
<title>The two-ball intersection and boundary fluxes</title>
<rect width="100%" height="100%" fill="white"/>
<g font-family="STIX Two Text, Noto Serif CJK SC, serif" fill="#1d2126">
<circle cx="160" cy="215" r="130" fill="#f5f2eb" stroke="#56606b" stroke-width="1.6"/>
<circle cx="247" cy="215" r="130" fill="none" stroke="#1f4a73" stroke-width="1.6"/>
<path d="M203.50,92.49 A130,130 0 0 0 203.50,337.51 A130,130 0 0 0 203.50,92.49 Z" fill="#1f4a73" fill-opacity="0.55" stroke="#c4532d" stroke-width="3.2"/>
<polygon points="247.0,215.0 237.0,219.5 237.0,210.5" fill="white"/>
<line x1="160" y1="215" x2="237.0" y2="215.0" stroke="white" stroke-width="2"/>
<text x="203.5" y="201" font-size="19" fill="white" text-anchor="middle" font-weight="normal" font-family="STIX Two Text, STIX Two Math, serif"><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">d</tspan><tspan> = </tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">s n</tspan></text>
<text x="30" y="68" font-size="19" fill="#56606b" text-anchor="start" font-weight="normal"><tspan>Incident ball |</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">y</tspan><tspan>| ≤ </tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">B</tspan></text>
<text x="267" y="378" font-size="19" fill="#1f4a73" text-anchor="middle" font-weight="normal"><tspan>Observation ball |</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">y</tspan><tspan> − </tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">d</tspan><tspan>| ≤ </tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">B</tspan></text>
<text x="30" y="410" font-size="17" fill="#1d2126" text-anchor="start" font-weight="normal">Dark lens: retained domain; vermilion boundary: sphere supporting both fluxes</text>
<rect x="440" y="40" width="540" height="125" rx="6" fill="white" stroke="#d7dbe0" stroke-width="1.2"/>
<rect x="440" y="43" width="4" height="119" fill="#1f4a73"/>
<text x="456" y="69" font-size="19" fill="#1d2126" text-anchor="start" font-weight="600">Even a constant kernel has a cusp</text>
<text x="456" y="96" font-size="17" fill="#1d2126" text-anchor="start" font-weight="normal"><tspan>Vol(lens) = 4π</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">B</tspan><tspan dy="-0.571em" font-size="11.9">3</tspan><tspan dy="0.400em">/3 − π</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">B</tspan><tspan dy="-0.571em" font-size="11.9">2</tspan><tspan dy="0.400em">|</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">s</tspan><tspan>| + π|</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">s</tspan><tspan>|</tspan><tspan dy="-0.571em" font-size="11.9">3</tspan><tspan dy="0.400em">/12</tspan></text>
<text x="456" y="121" font-size="17" fill="#1d2126" text-anchor="start" font-weight="normal"><tspan>0 ≤ |</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">s</tspan><tspan>| ≤ 2</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">B</tspan></text>
<text x="456" y="146" font-size="17" fill="#1d2126" text-anchor="start" font-weight="normal">Quadratic coefficient ≠ origin Hessian of the full cusp response</text>
<rect x="440" y="190" width="540" height="125" rx="6" fill="white" stroke="#d7dbe0" stroke-width="1.2"/>
<rect x="440" y="193" width="4" height="119" fill="#1f4a73"/>
<text x="456" y="219" font-size="19" fill="#1d2126" text-anchor="start" font-weight="600">Fixed input; expand the exact radial endpoint</text>
<text x="456" y="246" font-size="17" fill="#1d2126" text-anchor="start" font-weight="normal"><tspan>body: ½ ∫</tspan><tspan dy="0.429em" font-size="11.9">ball</tspan><tspan dy="-0.300em"> Re </tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">R</tspan><tspan dy="0.429em" font-size="11.9">dd</tspan></text>
<text x="456" y="271" font-size="17" fill="#1d2126" text-anchor="start" font-weight="normal"><tspan>first flux: ½ ∫</tspan><tspan dy="0.429em" font-size="11.9">sphere</tspan><tspan dy="-0.300em"> </tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">u</tspan><tspan> Re </tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">R</tspan><tspan dy="0.429em" font-size="11.9">d</tspan></text>
<text x="456" y="296" font-size="17" fill="#1d2126" text-anchor="start" font-weight="normal"><tspan>zeroth flux: ¼ ∫</tspan><tspan dy="0.429em" font-size="11.9">sphere</tspan><tspan dy="-0.300em"> [</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">u</tspan><tspan dy="-0.571em" font-size="11.9">2</tspan><tspan dy="0.400em"> ∂</tspan><tspan dy="0.429em" font-size="11.9">r</tspan><tspan dy="-0.300em"> Re </tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">R</tspan><tspan dy="0.429em" font-size="11.9">0</tspan><tspan dy="-0.300em"> + (3</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">u</tspan><tspan dy="-0.571em" font-size="11.9">2</tspan><tspan dy="0.400em">−1) Re </tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">R</tspan><tspan dy="0.429em" font-size="11.9">0</tspan><tspan dy="-0.300em">/</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">B</tspan><tspan>]</tspan></text>
<rect x="20" y="432" width="960" height="122" rx="6" fill="#f5f2eb" stroke="#d7dbe0" stroke-width="1.2"/>
<text x="40" y="467" font-size="19" fill="#1d2126" text-anchor="start" font-weight="normal"><tspan>Affine-field check: </tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">a</tspan><tspan>(</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">k</tspan><tspan>) = [1 + (2+i)</tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">k</tspan><tspan dy="0.429em" font-size="13.3">3</tspan><tspan dy="-0.300em">] </tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">b</tspan><tspan>,  </tspan><tspan font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">b</tspan><tspan dy="-0.571em" font-size="13.3">T</tspan><tspan dy="0.400em" font-style="italic" font-family="STIX Two Text, STIX Two Math, serif">Qb</tspan><tspan> = 4</tspan></text>
<text x="40" y="503" font-size="21" fill="#c4532d" text-anchor="start" font-weight="600">Boundary flux = nonzero gradient energy → quadratic coefficient 0</text>
<text x="40" y="537" font-size="17" fill="#1d2126" text-anchor="start" font-weight="normal"><tspan>Deleting the flux creates a spurious negative quadratic term. Volume and area retain the original (2π)</tspan><tspan dy="-0.571em" font-size="11.9">−3</tspan><tspan dy="0.400em"> measure.</tspan></text>
</g></svg>
