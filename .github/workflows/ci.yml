name: CI

on:
  push:
    branches: [main]
    paths-ignore: &display-files
      - README.md
      - LICENSE
      - NOTICE
      - docs/assets/**
      - docs/reproduction.md
      - docs/evidence-map.md
      - docs/source-materials.md
      - docs/evidence-publication.md
      - docs/ci.md
  pull_request:
    paths-ignore: *display-files
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: 构建分工
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      lean: ${{ steps.plan.outputs.lean }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        run: python3 tools/ci_plan.py plan
      - uses: actions/upload-artifact@v4
        with:
          name: lean-plan
          path: .local/ci/plan.json
          include-hidden-files: true
          retention-days: 1

  evidence-checks:
    name: 冻结证据独立检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Makefile
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: make check-map check

  lean-base:
    name: Lean · 共享基础
    needs: plan
    if: needs.plan.outputs.lean == 'true' && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    uses: ./.github/workflows/lean-part.yml
    with:
      part: base

  lean-parts:
    name: Lean · ${{ matrix.part }}
    needs: [plan, lean-base]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/lean-part.yml
    with:
      part: ${{ matrix.part }}
      dependencies: lean-part-base

  lean-complete:
    name: Lean · 完整选集
    needs: [lean-base, lean-parts]
    uses: ./.github/workflows/lean-part.yml
    with:
      part: integration
      dependencies: lean-part-*
      verify-defaults: true
