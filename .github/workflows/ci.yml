name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evidence-checks:
    name: 冻结证据独立检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen evidence checks
        run: make check

  lean-build:
    name: 独立 Lean 构建
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # The default build (mathlib cache plus ~16.8k modules) exceeds the ~14 GB
      # a standard runner leaves free; the 2026-09-20 run stopped at module
      # 9440/11481 with "no space left on device". Remove preinstalled
      # toolchains the build never uses.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: false
          build: true
          test: false
          lint: false
      - name: Disk usage after build
        if: always()
        run: df -h / && du -sh Lean/.lake/build Lean/.lake/packages 2>/dev/null || true
