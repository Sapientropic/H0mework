name: CI

on:
  push:
    branches: [main]
    paths-ignore: &display-files
      - README.md
      - LICENSE
      - NOTICE
      - docs/assets/**
      - docs/reproduction.md
      - docs/evidence-map.md
      - docs/source-materials.md
      - docs/evidence-publication.md
      - docs/ci.md
  pull_request:
    paths-ignore: *display-files
  workflow_dispatch:
    inputs:
      continuation:
        description: Continuation count after a deadline stop (set by the workflow)
        type: number
        default: 0

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Pushes replace older runs, whose Lean jobs save their progress first. A dispatched
  # continuation queues behind the run that requested it.
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  plan:
    name: 构建分工
    runs-on: ubuntu-latest
    # The verified-selection record lives in the draft proof-store release.
    permissions:
      contents: write
    outputs:
      stages: ${{ steps.plan.outputs.stages }}
      s1: ${{ steps.plan.outputs.s1 }}
      s2: ${{ steps.plan.outputs.s2 }}
      s3: ${{ steps.plan.outputs.s3 }}
      s4: ${{ steps.plan.outputs.s4 }}
      s5: ${{ steps.plan.outputs.s5 }}
      s6: ${{ steps.plan.outputs.s6 }}
      s7: ${{ steps.plan.outputs.s7 }}
      s8: ${{ steps.plan.outputs.s8 }}
      verified: ${{ steps.seal.outputs.verified }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: plan
        run: python3 tools/ci_plan.py plan
      - name: Look up the verified selection
        id: seal
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_plan.py sealed --output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: lean-plan
          path: |
            .local/ci/plan.json
            .local/ci/store.json
          include-hidden-files: true
          retention-days: 1
          overwrite: true

  evidence-checks:
    name: 冻结证据独立检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Makefile
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - run: make check-map check

  lean-s1:
    name: Lean 阶段 1
    permissions:
      contents: write
    needs: plan
    if: needs.plan.outputs.verified != 'true' && (github.event_name == 'workflow_dispatch' || !github.event.repository.private)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.s1) }}
    uses: ./.github/workflows/lean-part.yml
    with:
      part: ${{ matrix.part }}

  lean-s2:
    name: Lean 阶段 2
    permissions:
      contents: write
    needs: [plan, lean-s1]
    if: fromJSON(needs.plan.outputs.stages) >= 2
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.s2) }}
    uses: ./.github/workflows/lean-part.yml
    with:
      part: ${{ matrix.part }}

  lean-s3:
    name: Lean 阶段 3
    permissions:
      contents: write
    needs: [plan, lean-s2]
    if: fromJSON(needs.plan.outputs.stages) >= 3
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.s3) }}
    uses: ./.github/workflows/lean-part.yml
    with:
      part: ${{ matrix.part }}

  lean-s4:
    name: Lean 阶段 4
    permissions:
      contents: write
    needs: [plan, lean-s3]
    if: fromJSON(needs.plan.outputs.stages) >= 4
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.s4) }}
    uses: ./.github/workflows/lean-part.yml
    with:
      part: ${{ matrix.part }}

  lean-s5:
    name: Lean 阶段 5
    permissions:
      contents: write
    needs: [plan, lean-s4]
    if: fromJSON(needs.plan.outputs.stages) >= 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.s5) }}
    uses: ./.github/workflows/lean-part.yml
    with:
      part: ${{ matrix.part }}

  lean-s6:
    name: Lean 阶段 6
    permissions:
      contents: write
    needs: [plan, lean-s5]
    if: fromJSON(needs.plan.outputs.stages) >= 6
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.s6) }}
    uses: ./.github/workflows/lean-part.yml
    with:
      part: ${{ matrix.part }}

  lean-s7:
    name: Lean 阶段 7
    permissions:
      contents: write
    needs: [plan, lean-s6]
    if: fromJSON(needs.plan.outputs.stages) >= 7
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.s7) }}
    uses: ./.github/workflows/lean-part.yml
    with:
      part: ${{ matrix.part }}

  lean-s8:
    name: Lean 阶段 8
    permissions:
      contents: write
    needs: [plan, lean-s7]
    if: fromJSON(needs.plan.outputs.stages) >= 8
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.s8) }}
    uses: ./.github/workflows/lean-part.yml
    with:
      part: ${{ matrix.part }}

  lean-complete:
    name: Lean · 完整选集
    needs: [plan, lean-s1, lean-s2, lean-s3, lean-s4, lean-s5, lean-s6, lean-s7, lean-s8]
    # Stages past the plan's last one are skipped; any failed or cancelled stage stops here.
    if: >-
      always() && needs.lean-s1.result == 'success'
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    permissions:
      contents: write
    uses: ./.github/workflows/lean-part.yml
    with:
      part: complete

  continue:
    name: 到期续跑
    needs: [lean-s1, lean-s2, lean-s3, lean-s4, lean-s5, lean-s6, lean-s7, lean-s8, lean-complete]
    if: >-
      !cancelled() && contains(needs.*.result, 'failure') && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Continue parts that stopped at their deadline
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUATION: ${{ inputs.continuation || 0 }}
        run: |
          stopped=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].name | select(startswith("lean-incomplete-"))')
          if [ -z "$stopped" ]; then
            echo "No part stopped at its deadline with new progress"
            exit 0
          fi
          echo "$stopped"
          if [ "$CONTINUATION" -ge 12 ]; then
            echo "::error::Stopped after $CONTINUATION continuation runs"
            exit 1
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f continuation="$((CONTINUATION + 1))"
