name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  evidence-checks:
    name: 冻结证据独立检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frozen evidence checks
        run: make check

  lean-build:
    name: 独立 Lean 构建
    # A full build takes about two hours; while the repository is private it
    # would draw on the account's Actions minutes, so it runs on manual dispatch
    # there and on every push once the repository is public.
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # The mathlib cache and the ~19 GB of build artifacts exceed the ~14 GB a
      # standard runner leaves free. Remove preinstalled toolchains the build
      # never uses.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      # Lake writes ir/<module>.setup.json listing every transitive import's
      # artifacts (about 5 MB each here, over 90 GB for the whole build). Lean
      # reads it only when a module starts compiling, and deleting it afterwards
      # does not invalidate the build, so remove files older than a minute.
      - name: Start setup-file janitor
        run: |
          nohup setsid bash -c 'while true; do
            find Lean/.lake/build/ir -name "*.setup.json" -mmin +1 -delete 2>/dev/null
            sleep 30
          done' > /dev/null 2>&1 &
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: false
          build: true
          test: false
          lint: false
      - name: Disk usage after build
        if: always()
        run: df -h / && du -sh Lean/.lake/build Lean/.lake/packages 2>/dev/null || true
