name: Site

# Builds site/ (which reads papers/, docs/ and the Lean files the claim maps name at build time)
# and publishes it to Cloudflare Pages: main → h0mework.wiki, other branches and PRs → preview URLs.
on:
  push:
    branches: [main]
    paths: &site-inputs
      - site/**
      - papers/**
      - docs/*-map.json
      - .github/workflows/site.yml
  pull_request:
    paths: *site-inputs
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并发布站点
    runs-on: ubuntu-latest
    steps:
      # Skip the bytes of Lean/ and evidence/ the site never reads.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/
            /papers/
            /docs/
      # Later maps list declarations without line numbers; the build finds them in the mapped files.
      - name: Check out mapped Lean files
        run: |
          python3 - <<'PY' | git sparse-checkout add --stdin
          import glob, json
          paths = {producer["public"]["path"]
                   for map_path in glob.glob("docs/*-map.json")
                   for claim in json.load(open(map_path)).get("claims", [])
                   for producer in claim.get("producers", [])
                   if producer.get("kind") == "lean" and producer.get("public")}
          print("\n".join("/" + path for path in sorted(paths)))
          PY
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Build
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun run build
      # Fork PRs get no secrets; they still build above.
      - name: Ensure Pages project
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true # fails harmlessly once the project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create h0mework --production-branch=main
      - name: Publish
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=h0mework --branch=${{ github.head_ref || github.ref_name }}
