name: Site

# Builds site/ (which reads papers/ and docs/ at build time) and publishes it to
# Cloudflare Pages: main → h0mework.wiki, other branches and PRs → preview URLs.
on:
  push:
    branches: [main]
    paths: &site-inputs
      - site/**
      - papers/**
      - docs/first-release-map.json
      - .github/workflows/site.yml
  pull_request:
    paths: *site-inputs
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并发布站点
    runs-on: ubuntu-latest
    steps:
      # The site never reads Lean/ or evidence/, so skip their bytes.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            site
            papers
            docs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - name: Build
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun run build
      # Fork PRs get no secrets; they still build above.
      - name: Ensure Pages project
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true # fails harmlessly once the project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create h0mework --production-branch=main
      - name: Publish
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=h0mework --branch=${{ github.head_ref || github.ref_name }}
