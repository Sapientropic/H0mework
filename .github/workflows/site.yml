name: Site

# Builds site/ (which reads papers/, docs/, tools/export-map.json and the Lean files its claim rows name)
# and publishes it to Cloudflare Pages: main → h0mework.wiki, other branches and PRs → preview URLs.
on:
  push:
    branches: [main]
    paths: &site-inputs
      - site/**
      - papers/**
      - docs/*-map.json
      - tools/export-map.json
      - .github/workflows/site.yml
  pull_request:
    paths: *site-inputs
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: 构建并发布站点
    runs-on: ubuntu-latest
    steps:
      # Skip the bytes of Lean/ and evidence/ the site never reads.
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /site/
            /papers/
            /docs/
            /tools/export-map.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      # Later maps list declarations without line numbers; the build finds them in the Lean files it
      # reads. The site lists those files itself, from the same adapters that build the claim rows.
      - name: Check out the Lean files the site reads
        working-directory: site
        run: bun scripts/lean-paths.ts | git sparse-checkout add --stdin
      - name: Build
        working-directory: site
        run: |
          bun install --frozen-lockfile
          bun run build
      # Fork PRs get no secrets; they still build above.
      - name: Ensure Pages project
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true # fails harmlessly once the project exists
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create h0mework --production-branch=main
      - name: Publish
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=h0mework --branch=${{ github.head_ref || github.ref_name }}
