name: Lean part

on:
  workflow_call:
    inputs:
      part:
        required: true
        type: string

# The proof store is a draft release, which only tokens with push access can read.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PART: ${{ inputs.part }}
      ARCHIVE: .local/ci/cache/${{ inputs.part }}.tar.zst
      # Only runs of the main branch itself write to the proof store.
      STORE_WRITES: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - name: Start the build clock
        # A build stops 30 minutes before the job limit so its progress can be saved.
        run: echo "LEAN_DEADLINE=$(( $(date +%s) + 320 * 60 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          # The token reaches only the steps that use the proof store.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: lean-plan
          path: .local/ci
      - name: Read part identity
        id: identity
        run: python3 tools/ci_plan.py part --part "$PART" --output "$GITHUB_OUTPUT"
      - name: Fetch stored outputs
        id: store
        if: inputs.part != 'complete'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_plan.py fetch --part "$PART" --output "$GITHUB_OUTPUT"
      - name: Choose verified reuse or a Lean build
        id: mode
        # A full archive is stored only after the whole part built, so a hit is already verified.
        env:
          HIT: ${{ steps.store.outputs.hit }}
        run: |
          if [ "$HIT" = true ]; then
            echo "Checked outputs for this exact content are stored; passing them on"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Free runner disk space
        if: steps.mode.outputs.build == 'true' && inputs.part != 'complete'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - name: Restore fixed dependencies
        if: steps.mode.outputs.build == 'true'
        id: dependencies
        uses: actions/cache@v4
        with:
          path: Lean/.lake/packages
          key: lean-dependencies-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Lean/lean-toolchain', 'Lean/lake-manifest.json') }}
      - if: steps.mode.outputs.build == 'true'
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: Lean
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: ${{ steps.dependencies.outputs.cache-hit != 'true' }}
      - name: Download current upstream outputs
        if: steps.mode.outputs.build == 'true' && inputs.part != 'complete' && steps.identity.outputs.upstream != ''
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ steps.identity.outputs.upstream }}
          merge-multiple: true
          path: .local/ci/upstream
      - name: Restore own and upstream module outputs
        if: steps.mode.outputs.build == 'true' && inputs.part != 'complete'
        run: |
          shopt -s nullglob
          archives=(.local/ci/upstream/*.tar.zst)
          # Current upstream outputs take precedence over an older stored version of this part.
          if [ -f "$ARCHIVE" ]; then archives=("$ARCHIVE" "${archives[@]}"); fi
          for archive in "${archives[@]}"; do
            python3 tools/ci_plan.py unpack --archive "$archive"
          done
          rm -rf .local/ci/upstream
      - name: Build part using Lake freshness checks
        if: steps.mode.outputs.build == 'true' && inputs.part != 'complete'
        id: build
        # exec lets a cancelled run signal the build directly, which stops Lake cleanly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: exec python3 tools/ci_plan.py build --part "$PART" --deadline "$LEAN_DEADLINE" --output "$GITHUB_OUTPUT"
      - name: Check that the parts cover every default module
        if: inputs.part == 'complete'
        # Each part already passed its own build; Lake's module lists confirm none is missing.
        run: python3 tools/ci_plan.py coverage
      - name: Pack this part's module artifacts
        id: pack
        if: >-
          always() && steps.build.outputs.started == 'true'
          && (steps.store.outputs.hit != 'true' || steps.build.outputs.current != 'true')
        env:
          BUILD_STATUS: ${{ steps.build.outputs.status }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # Nothing from a cancelled build may still write while its outputs are packed.
          for sig in INT TERM KILL; do
            pgrep -x 'lake|lean' > /dev/null || break
            pkill "-$sig" -x 'lake|lean' || true
            sleep 3
          done
          pack_args=()
          if [ "$BUILD_STATUS" != complete ] || [ "$JOB_STATUS" != success ]; then
            pack_args+=(--checkpoint)
          fi
          python3 tools/ci_plan.py pack --part "$PART" --archive "$ARCHIVE" "${pack_args[@]}"
      - name: Store the verified part
        if: env.STORE_WRITES == 'true' && steps.store.outputs.hit != 'true' && steps.build.outputs.status == 'complete'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_plan.py save --part "$PART"
      - name: Store progress for the next run
        if: (failure() || cancelled()) && steps.pack.outcome == 'success' && env.STORE_WRITES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_plan.py save --part "$PART" --progress "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Note a deadline stop
        if: failure() && steps.build.outputs.status == 'incomplete'
        env:
          BUILT: ${{ steps.build.outputs.built }}
        run: |
          if [ "$BUILT" = 0 ]; then
            echo "::error::No module finished before the deadline; continuation stops here"
          else
            echo "$BUILT" > ".local/ci/$PART.stopped"
          fi
      - name: Request a continuation run
        if: failure() && steps.build.outputs.status == 'incomplete' && steps.build.outputs.built != '0'
        uses: actions/upload-artifact@v4
        with:
          name: lean-incomplete-${{ inputs.part }}-${{ github.run_attempt }}
          path: .local/ci/${{ inputs.part }}.stopped
          include-hidden-files: true
          retention-days: 1
          overwrite: true
      - name: Record the verified selection and drop superseded outputs
        if: inputs.part == 'complete' && env.STORE_WRITES == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_plan.py seal && python3 tools/ci_plan.py prune
      - name: Pass checked outputs to downstream jobs
        if: inputs.part != 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: lean-part-${{ inputs.part }}
          path: .local/ci/cache/${{ inputs.part }}.tar.zst
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      - name: Disk usage after build
        if: always()
        run: df -h / && du -sh Lean/.lake/build Lean/.lake/packages 2>/dev/null || true
